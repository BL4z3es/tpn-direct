name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The gate. The alternative to catching a mistake here is catching it in
  # deploy.sh's health check on the server, and that costs a failed start and a
  # rollback. Add this project's own tests and linters to it.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The server installs the project the same way (deploy/easy-deploy.conf).
      - name: Install
        run: pip install -e . pytest ruff

      - run: ruff check .
      - run: pytest

  # One SSH session to the server; the forced command on the key runs
  # deploy/deploy.sh there, which deploys origin/main and rolls back if it
  # does not come up. Secrets: VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_HOST, VPS_USER
  # (sudo deploy/install.sh --ci-key prints all four).
  deploy:
    needs: check
    uses: BL4z3es/easy-deploy/.github/workflows/deploy.yml@v1
    secrets: inherit
    # with:
    #   timeout-minutes: 10   # raise it if HEALTH_TRIES is long
    #   ssh-port: 22
