# VPN server: a tagged Tailscale exit node plus the tpn control API.
#   TS_AUTHKEY=tskey-auth-... docker compose up -d --build
# Use an auth key tagged tag:vpn-server so the exit node is auto-approved by the policy.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TPN_SERVER_NAME:-vpn-server-1}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY to a tag:vpn-server auth key}
      TS_EXTRA_ARGS: --advertise-tags=tag:vpn-server --advertise-exit-node
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
    volumes:
      - ts-state:/var/lib/tailscale
      - ts-socket:/var/run/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    # Shares the tailscale container's network namespace, so it can bind the tailnet IP.
    network_mode: service:tailscale
    environment:
      TPN_TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      TPN_API_PORT: "8443"
    volumes:
      - ts-socket:/var/run/tailscale
    depends_on:
      - tailscale
    restart: unless-stopped

volumes:
  ts-state:
  ts-socket:
