[project]
name = "tpn-direct"
version = "0.2.0"
description = "Tor-bootstrapped Tailscale exit-node VPN with a FastAPI control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# The VPN-server control API (`tpn serve`). Linux only; clients never install it.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
tpn = "tpn.cli:app"

[dependency-groups]
dev = [
    "tpn-direct[server]",
    "pytest>=8",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpn"]

[tool.ruff]
line-length = 100
extend-exclude = ["installer.py"]  # managed by easy-deploy
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
